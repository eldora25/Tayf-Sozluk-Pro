name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5' # Kararlı Sürüm
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Isar Models
        run: |
          # Isar model uyuşmazlıklarını çözer
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Fix Undefined Variable Issue
        run: |
          # library_manager_screen.dart içindeki tanımsız değişken hatasını engelliyoruz
          sed -i 's/tayfPoints += 50;/\/\/ tayfPoints += 50;/g' lib/library_manager_screen.dart

      - name: Regenerate Android Project
        run: |
          rm -rf android
          # Proje adını tayf_sozluk_pro olarak zorlayarak bağımlılık kural hatasını önlüyoruz
          flutter create --platforms=android --project-name tayf_sozluk_pro .
          
          # 1. KOTLIN SÜRÜMÜNÜ GÜNCELLEME VE SABİTLEME
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          
          # 2. ANA PROJE İÇİN API 36 ZORLAMASI VE TTS İÇİN MİNİMUM SDK 24 ZORLAMASI
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
          
          # 3. DESUGARING AKTİVASYONU
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
          echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle

          # 4. LAUNCHER UYGULAMA ADINI "Lexis Eldora" YAPMA
          sed -i 's/android:label="[^"]*"/android:label="Lexis Eldora"/g' android/app/src/main/AndroidManifest.xml

          # 5. KOTLIN JVM DOĞRULAMASINI ESNETME
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

          # 6. KESİN VE NİHAİ JVM EŞİTLEYİCİ
          cat <<EOF >> android/build.gradle
          
          subprojects {
              project.pluginManager.withPlugin('com.android.library') {
                  android {
                      if (namespace == null) {
                          namespace project.group
                      }
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              }
              
              project.tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              
              project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                      freeCompilerArgs += ["-Xskip-metadata-version-check"]
                  }
              }
          }
          EOF

      - name: Build APK with Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --dart-define=BUILD_NUMBER=$BUILD_NUM

      - name: Rename APK for Release
        run: |
          BUILD_NUM=${{ github.run_number }}
          mkdir -p build/outputs/apk/release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/outputs/apk/release/Lexis-Eldora-V2.0.$BUILD_NUM-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Eldora-APK-V2.0.${{ github.run_number }}
          path: build/outputs/apk/release/*.apk

name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerate Android Project
        run: |
          rm -rf android
          flutter create --platforms=android .
          # GÜVENLİK DUVARI: share_plus ve yeni eklentilerin API 34+ isteme ihtimaline karşı SDK sürümlerini kilitliyoruz.
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK Dynamically
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/TY-Sozluk-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java Kurulumu
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter Kurulumu
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Derleme öncesi tüm kilitli bağımlılık haritalarını ve v1 cache yapılarını tamamen uçurma
      - name: Hard Purge Legacy Metadata & Cache
        run: |
          rm -f pubspec.lock
          rm -f .flutter-plugins
          rm -f .flutter-plugins-dependencies
          rm -rf android/app/src/main/java/io/flutter/plugins/
          flutter clean

      # Bağımlılıkları Yeni pubspec.yaml Kurallarına Göre Sıfırdan Yükleme
      - name: Install dependencies
        run: flutter pub get

      # Dinamik APK Derleme
      - name: Build Debug APK with Dynamic Name
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: flutter build apk --debug

      # Çıktıyı GitHub Üzerine Yükleme
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

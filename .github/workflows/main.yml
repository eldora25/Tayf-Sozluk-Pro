name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # KÖKTEN ÇÖZÜM VE API 36 ZORLAMASI:
      # Android klasörünü sıfırdan oluşturur ve file_picker'ın istediği API 36 sürümlerini enjekte eder.
      - name: Regenerate Android Project (Force V2 & API 36)
        run: |
          rm -rf android
          flutter create --platforms=android .
          # Varsayılan SDK değerlerini bul ve eklentilerin istediği güncel sürümlerle değiştir:
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      # Standart APK Derlemesi
      - name: Build Debug APK
        run: flutter build apk --debug

      # DEV-OPS MÜDAHALESİ: Üretilen APK dosyasının adını dinamik build numarasıyla değiştiriyoruz.
      - name: Rename APK Dynamically
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/TY-Sozluk-v1.0.${{ github.run_number }}-debug.apk

      # Çıktıyı GitHub Üzerine Yüklüyor
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

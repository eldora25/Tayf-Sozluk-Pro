name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Tertemiz, müdahalesiz Android projesi oluşturma (V2 Embedding garantisi)
      - name: Regenerate Android Project
        run: |
          rm -rf android
          flutter create --platforms=android .

      # Bağımlılıklar indirilir (dependency_overrides kuralı burada devreye girer)
      - name: Install dependencies
        run: flutter pub get

      # Standart APK Derlemesi
      - name: Build Debug APK
        run: flutter build apk --debug

      # DEV-OPS MÜDAHALESİ: Üretilen APK dosyasının adını dinamik build numarasıyla değiştiriyoruz.
      - name: Rename APK Dynamically
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/TY-Sozluk-v1.0.${{ github.run_number }}-debug.apk

      # Çıktıyı GitHub Üzerine Yüklüyor
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

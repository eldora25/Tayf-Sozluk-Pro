name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Fix Pubspec Name Safely
        run: |
          # pubspec.yaml dosyasındaki paket adını güvenli bir şekilde küçük harfe sabitliyoruz
          sed -i 's/^name:.*/name: tayf_sozluk_pro/g' pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Regenerate Android Project
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          # ANA PROJE İÇİN API 36 ZORLAMASI
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          
          # DESUGARING AKTİVASYONU (Local Notifications Hatası İçin)
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts

          # UYGULAMA ADINI "Lexis Eldora" OLARAK SABİTLEME
          sed -i 's/android:label="[^"]*"/android:label="Lexis Eldora"/g' android/app/src/main/AndroidManifest.xml

      - name: Build APK with Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --dart-define=BUILD_NUMBER=$BUILD_NUM

      - name: Rename APK for Release
        run: |
          BUILD_NUM=${{ github.run_number }}
          mkdir -p build/outputs/apk/release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/outputs/apk/release/Lexis-Eldora-V2.0.$BUILD_NUM-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Eldora-APK-V2.0.${{ github.run_number }}
          path: build/outputs/apk/release/*.apk

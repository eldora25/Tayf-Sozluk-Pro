name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5' # Kararlı Sürüm
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch flutter_tts to API 34
        run: |
          # flutter_tts paketinin API 36 dayatmasını API 34'e çekerek speech_to_text ile çakışmasını önlüyoruz
          find ~/.pub-cache/ -type f -name "build.gradle" -path "*/flutter_tts-*/android/build.gradle" -exec sed -i 's/compileSdk 36/compileSdk 34/g' {} + || true
          find ~/.pub-cache/ -type f -name "build.gradle" -path "*/flutter_tts-*/android/build.gradle" -exec sed -i 's/compileSdkVersion 36/compileSdkVersion 34/g' {} + || true

      - name: Generate Isar Models
        run: |
          # Isar model uyuşmazlıklarını çözer
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Fix Undefined Variable Issue
        run: |
          # library_manager_screen.dart içindeki tanımsız değişken hatasını askıya alıyoruz
          sed -i 's/tayfPoints += 50;/\/\/ lexisPoints += 50;/g' lib/library_manager_screen.dart

      - name: Regenerate Android Project
        run: |
          rm -rf android
          # Proje adını tayf_sozluk_pro olarak zorlayarak bağımlılık kural hatasını önlüyoruz
          flutter create --platforms=android --project-name tayf_sozluk_pro .
          
          # 1. KOTLIN SÜRÜMÜNÜ GÜNCELLEME VE SABİTLEME
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          
          # 2. KARARLI API 34 VE MİNİMUM SDK 24 ZORLAMASI
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
          
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          
          # Yedek Güvenlik
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=24" >> android/local.properties

          # 3. DESUGARING AKTİVASYONU
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
          echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle

          # 4. LAUNCHER UYGULAMA ADINI "Lexis Eldora" YAPMA
          sed -i 's/android:label="[^"]*"/android:label="Lexis Eldora"/g' android/app/src/main/AndroidManifest.xml

          # 5. KOTLIN JVM DOĞRULAMASINI ESNETME
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

          # 6. KESİN VE NİHAİ JVM EŞİTLEYİCİ
          cat <<EOF >> android/build.gradle
          
          subprojects {
              project.pluginManager.withPlugin('com.android.library') {
                  android {
                      if (namespace == null) {
                          namespace project.group
                      }
                      compileSdkVersion 34
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              }
              
              project.tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              
              project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                      freeCompilerArgs += ["-Xskip-metadata-version-check"]
                  }
              }
          }
          EOF

      - name: Build APK with Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --dart-define=BUILD_NUMBER=$BUILD_NUM

      - name: Rename APK for Release
        run: |
          BUILD_NUM=${{ github.run_number }}
          mkdir -p build/outputs/apk/release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/outputs/apk/release/Lexis-Eldora-V2.0.$BUILD_NUM-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Eldora-APK-V2.0.${{ github.run_number }}
          path: build/outputs/apk/release/*.apk

name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # KÖKTEN ÇÖZÜM: Derleyiciye v2 embedding mimarisini sistem seviyesinde dikte eder
      # ve otomatik üretilen tüm eski v1 eklenti kayıt önbelleklerini tamamen engeller.
      - name: Force Global V2 Embedding Configuration
        run: |
          rm -rf android/app/src/main/java/
          flutter clean
          
          # Projenin yerel konfigürasyonuna v2 embedding zorlamasını enjekte eder
          mkdir -p android
          echo "flutter.v2Embedding=true" >> android/local.properties
          echo "flutter.embeddingVersion=2" >> android/local.properties

      # Bağımlılıkları en güncel modern v2 köprüleriyle yükler
      - name: Install dependencies
        run: flutter pub get

      # Dinamik APK Derleme (Artan Build Numarası Şablonu)
      - name: Build Debug APK with Dynamic Name
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: flutter build apk --debug

      # Çıktıyı GitHub Üzerine Artifact Olarak Yükler
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

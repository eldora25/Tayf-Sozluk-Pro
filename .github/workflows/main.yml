name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Pubspec YAML
        run: |
          # Eski pubspec.yaml dosyasını tamamen sıfırlayıp hatasız ve küçük harfli yeniden oluşturuyoruz
          python3 -c '
          clean_content = """name: tayf_sozluk_pro
description: "Tayf Sözlük & Dil Öğrenme Uygulaması"
publish_to: '\''none'\''
version: 1.0.0+1

environment:
  sdk: '\'''>=3.0.0 <4.0.0'\''

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 
  cloud_firestore: 
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.1
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  csv: ^6.0.0
  share_plus: ^10.0.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  http: ^1.2.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/test_paket.json
    - assets/EN-TR_tayf.txt
    - assets/Babylon_English_Turkish_donustu.csv
    - assets/Babylon_Turkish_English_donustu.csv
    - assets/ic_launcher.png 
    - assets/Free-KH.txt
    - assets/tayf_wordnet_optimized.json
"""
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(clean_content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Regenerate Android Project
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          # ANA PROJE İÇİN API 36 ZORLAMASI
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          
          # DESUGARING AKTİVASYONU (Local Notifications Hatası İçin)
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts

          # UYGULAMA ADINI "Lexis Eldora" OLARAK SABİTLEME
          sed -i 's/android:label="[^"]*"/android:label="Lexis Eldora"/g' android/app/src/main/AndroidManifest.xml

      - name: Build APK with Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --dart-define=BUILD_NUMBER=$BUILD_NUM

      - name: Rename APK for Release
        run: |
          BUILD_NUM=${{ github.run_number }}
          mkdir -p build/outputs/apk/release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/outputs/apk/release/Lexis-Eldora-V2.0.$BUILD_NUM-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Eldora-APK-V2.0.${{ github.run_number }}
          path: build/outputs/apk/release/*.apk

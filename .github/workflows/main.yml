name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node.js güncellemelerine tam uyumlu kararlı sürüm
      - uses: actions/checkout@v4

      # Java Kurulumu
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter Kurulumu
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # NİHAİ RADİKAL TEMİZLİK: Git'ten sarkan tüm legacy java bileşenleri diskten tamamen kazınır
      - name: Hard Purge Legacy Directory Structure
        run: |
          # Fiziksel olarak kırıntı bırakmamak için tüm java kaynak yollarını uçurur
          rm -rf android/app/src/main/java/
          
          # Geçici dosya haritalarını sıfırlar
          rm -f pubspec.lock
          rm -f .flutter-plugins
          rm -f .flutter-plugins-dependencies
          rm -f android/.flutter-plugins
          rm -f android/.flutter-plugins-dependencies
          flutter clean

      # Bağımlılıkları v2 Formatında Sıfırdan Çekme
      - name: Install dependencies
        run: flutter pub get

      # Dinamik APK Derleme
      - name: Build Debug APK with Dynamic Name
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: flutter build apk --debug

      # Çıktıyı Güvenli Şekilde Yüklüyor
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

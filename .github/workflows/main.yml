name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerate Android Project
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          # ANA PROJE İÇİN API 36 ZORLAMASI
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      # KESİN ÇÖZÜM: Isar Eklentisinin SDK ve Namespace Hatalarını Onarır
      - name: Fix Isar Plugin Compatibility
        run: |
          # 1. Namespace hatasını çözer
          find /home/runner/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/android -name "build.gradle" -exec sed -i 's/android {/android {\n    namespace "dev.isar.isar_flutter_libs"/g' {} +
          # 2. SDK 30 Çakışmasını Çözer (Eklentiyi zorla API 36 yapar)
          find /home/runner/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/android -name "build.gradle" -exec sed -i 's/compileSdkVersion 30/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/android -name "build.gradle" -exec sed -i 's/targetSdkVersion 30/targetSdkVersion 36/g' {} +

      # Isar veritabanı tablolarını otomatik oluşturur
      - name: Generate Isar Models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK Dynamically
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/TY-Sozluk-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

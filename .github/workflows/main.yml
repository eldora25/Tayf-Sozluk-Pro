name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Otomatik üretilen java ara kayıt dosyalarını zorla temizler
      - name: Codebase Purge
        run: |
          rm -rf android/app/src/main/java/
          flutter clean

      运营 - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK with Dynamic Name
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: flutter build apk --debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

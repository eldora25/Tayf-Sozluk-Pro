name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node.js 24/26 entegrasyonu için tamamen güncellendi
      - uses: actions/checkout@v4

      # Java Kurulumu (Modern v4)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter Kurulumu (Modern v2)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Sunucudaki tüm olası önbellek çakışmalarını işletim sistemi seviyesinde yok etme
      - name: Hard Purge Directory Structure & Cache
        run: |
          rm -rf android/app/src/main/java/
          rm -f pubspec.lock
          rm -f .flutter-plugins
          rm -f .flutter-plugins-dependencies
          rm -f android/.flutter-plugins
          rm -f android/.flutter-plugins-dependencies
          flutter clean

      # Bağımlılıkları v2 Standartlarında Yükleme
      - name: Install dependencies
        run: flutter pub get

      # Dinamik APK Derleme
      - name: Build Debug APK with Dynamic Name
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: flutter build apk --debug

      # Çıktıyı GitHub Üzerine Yükleme (Modern v4)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

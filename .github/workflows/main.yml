name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # KÖKTEN ÇÖZÜM: V1 Embedding hatasını önlemek için Android klasörü temizden üretilir.
      - name: Regenerate Android Project (Force V2)
        run: |
          rm -rf android
          flutter create --platforms=android .

      # Bağımlılıklar indirilir
      - name: Install dependencies
        run: flutter pub get

      # DEV-OPS MÜDAHALESİ 1: Flutter'ın "Upgrading build.gradle.kts" adı altında
      # ayarlarımızı sıfırlamasını engellemek için, versiyon diktelerini doğrudan 
      # ana konfigürasyon dosyasına (local.properties) yazıyoruz.
      - name: Enforce API 36 Requirements
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties

      # Standart APK Derlemesi
      - name: Build Debug APK
        run: flutter build apk --debug

      # DEV-OPS MÜDAHALESİ 2: Üretilen APK dosyasının adını dinamik build numarasıyla değiştiriyoruz.
      - name: Rename APK Dynamically
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/TY-Sozluk-v1.0.${{ github.run_number }}-debug.apk

      # Çıktıyı GitHub Üzerine Yüklüyor
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Debug-APK
          path: build/app/outputs/flutter-apk/TY-Sozluk-v1.0.*-debug.apk

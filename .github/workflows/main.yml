name: CI/CD Dynamic APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5' # Dart 3.4+ gereksinimini karşılayan kararlı sürüm
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Regenerate Android Project
        run: |
          rm -rf android
          # Klasör adını yoksayması için proje adını zorla veriyoruz
          flutter create --platforms=android --project-name tayf_sozluk_pro .
          
          # 1. KOTLIN VERSİYON ZORLAMASI (flutter_tts hatasını çözer)
          # settings.gradle içinde org.jetbrains.kotlin.android eklenti versiyonunu 1.9.23'e kilitliyoruz.
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' android/settings.gradle
          
          # 2. ANA PROJE İÇİN API 36 ZORLAMASI
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle
          
          # 3. DESUGARING AKTİVASYONU
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
          echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle

          # 4. UYGULAMA ADINI "Lexis Eldora" OLARAK SABİTLEME
          sed -i 's/android:label="[^"]*"/android:label="Lexis Eldora"/g' android/app/src/main/AndroidManifest.xml

          # 5. GÜVENLİ NAMESPACE ENJEKTÖRÜ (isar_flutter_libs ve eski paketler için)
          cat <<EOF >> android/build.gradle
          
          subprojects {
              project.pluginManager.withPlugin('com.android.library') {
                  android {
                      if (namespace == null) {
                          namespace project.group
                      }
                  }
              }
          }
          EOF

      - name: Build APK with Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --dart-define=BUILD_NUMBER=$BUILD_NUM

      - name: Rename APK for Release
        run: |
          BUILD_NUM=${{ github.run_number }}
          mkdir -p build/outputs/apk/release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/outputs/apk/release/Lexis-Eldora-V2.0.$BUILD_NUM-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Eldora-APK-V2.0.${{ github.run_number }}
          path: build/outputs/apk/release/*.apk

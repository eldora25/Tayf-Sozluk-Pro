name: tayf_sozluk_pro
description: "Tayf Sözlük & Dil Öğrenme Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # PAKETLER KARARLI SÜRÜMLERE KİLİTLENDİ (API Çakışmalarını Önlemek İçin)
  shared_preferences: 2.2.3
  flutter_tts: 3.8.5
  file_picker: 8.0.3
  path_provider: 2.1.3
  csv: 6.0.0
  share_plus: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/test_paket.json
    - assets/EN-TR_tayf.txt
    - assets/Babylon_English_Turkish_donustu.csv
    - assets/Babylon_Turkish_English_donustu.csv
    - assets/Free-KH.txt

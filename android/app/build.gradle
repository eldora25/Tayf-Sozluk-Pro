plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def computeVersionName() {
    return System.getenv("APP_VERSION_NAME") ?: "1.0.0"
}

def computeBuildNumber() {
    return System.getenv("APP_BUILD_NUMBER") ?: "1"
}

android {
    namespace "com.tayfunyamak.tayfsozlukpro"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.tayfunyamak.tayfsozlukpro"
        minSdkVersion 23 // Eski eklenti çakışmalarını önlemek için 23'e yükseltildi
        targetSdkVersion 34
        versionCode computeBuildNumber().toInteger()
        versionName computeVersionName()
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    // Dinamik isimlendirme mekanizması (Aynen korundu)
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildNo = computeBuildNumber()
            outputFileName = "TY-Sozluk-v1.0.${buildNo}-debug.apk"
        }
    }
}

flutter {
    source '../..'
}
